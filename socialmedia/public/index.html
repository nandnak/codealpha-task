<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialConnect – Home</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (!localStorage.getItem('token')) {
      window.location.replace('/login.html');
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/index.html" class="nav-brand">SocialConnect</a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="/index.html" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="/index.html#search" class="nav-link" id="nav-search" onclick="showSearch(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span>Search</span>
        </a>
        <a href="#create" class="nav-link" onclick="focusCreatePost(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Create</span>
        </a>
        <a href="/profile.html" class="nav-link" id="nav-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </a>
        <a href="#" class="nav-link" id="logout-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Logout</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <!-- Search Panel -->
    <section id="search-panel" class="hidden">
      <div class="page-header">
        <h1>Search Users</h1>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search by username or email..." autocomplete="off">
      </div>
      <div id="search-results">
        <div class="empty-state">
          <h3>Search for people</h3>
          <p>Enter a username or email to find users</p>
        </div>
      </div>
    </section>

    <!-- Feed Panel -->
    <section id="feed-panel">
      <div class="card" id="create">
        <div class="card-body">
          <form class="create-post" id="create-post-form">
            <img class="create-post-avatar" id="create-post-avatar" src="" alt="You">
            <div class="create-post-form">
              <textarea id="new-post-content" placeholder="What's on your mind?" maxlength="2000" required></textarea>
              <div class="create-post-actions">
                <input class="image-url-input" type="url" id="new-post-image" placeholder="Image URL (optional)">
                <button class="btn btn-primary" type="submit">Post</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div id="feed">
        <div class="loading"><div class="spinner"></div><p>Loading feed...</p></div>
      </div>
    </section>
  </main>

  <!-- Edit Post Modal -->
  <div class="modal-overlay" id="edit-post-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Post</h3>
        <button class="modal-close" type="button" onclick="closeModal('edit-post-modal')">&times;</button>
      </div>
      <form id="edit-post-form">
        <div class="modal-body">
          <input type="hidden" id="edit-post-id">
          <div class="form-group">
            <label for="edit-post-content">Content</label>
            <textarea id="edit-post-content" maxlength="2000" required></textarea>
          </div>
          <div class="form-group">
            <label for="edit-post-image">Image URL</label>
            <input type="url" id="edit-post-image" placeholder="https://...">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" onclick="closeModal('edit-post-modal')">Cancel</button>
          <button class="btn btn-primary" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/post.js"></script>
  <script src="/js/feed.js"></script>
  <script>
    function showSearch(e) {
      e.preventDefault();
      document.getElementById('search-panel').classList.remove('hidden');
      document.getElementById('feed-panel').classList.add('hidden');
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById('nav-search').classList.add('active');
      document.getElementById('search-input').focus();
      document.getElementById('nav-links').classList.remove('open');
    }

    function focusCreatePost(e) {
      e.preventDefault();
      document.getElementById('search-panel').classList.add('hidden');
      document.getElementById('feed-panel').classList.remove('hidden');
      document.getElementById('new-post-content').focus();
      document.getElementById('nav-links').classList.remove('open');
    }

    // Handle hash for search
    if (window.location.hash === '#search') {
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('nav-search').click();
      });
    }
  </script>
</body>
</html>
